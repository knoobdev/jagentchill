appId: dev.jagentchill.devclient
---
- swipe:
    start: 50%, 15%
    end: 50%, 90%
    duration: 400
- waitForAnimationToEnd
- assertVisible:
    id: compact-editor
- tapOn:
    id: open-export
- waitForAnimationToEnd:
    timeout: 15000
- assertVisible:
    id: export-dialog
- swipe:
    start: 50%, 70%
    end: 50%, 35%
    duration: 400
- swipe:
    start: 50%, 70%
    end: 50%, 35%
    duration: 400
- tapOn:
    id: export-start
- assertVisible:
    id: host-export-stage
