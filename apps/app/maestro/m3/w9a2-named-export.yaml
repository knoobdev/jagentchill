appId: dev.jagentchill.devclient
---
- tapOn:
    id: export-dismiss
- waitForAnimationToEnd
- tapOn:
    id: open-export
- waitForAnimationToEnd:
    timeout: 15000
- assertVisible:
    id: export-dialog
- swipe:
    start: 50%, 70%
    end: 50%, 35%
    duration: 400
- swipe:
    start: 50%, 70%
    end: 50%, 35%
    duration: 400
- tapOn:
    id: export-file-name
- eraseText: 64
- inputText: New project 4
- hideKeyboard
- tapOn:
    id: export-start
- assertVisible:
    id: host-export-stage
