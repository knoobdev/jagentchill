- assertVisible:
    id: workspace-pane
- assertVisible:
    id: workspace-tab-worklog
- tapOn:
    id: workspace-tab-assets
- assertVisible:
    id: workspace-tab-assets
- tapOn:
    id: workspace-tab-agents
- assertVisible:
    id: workspace-tab-agents
- tapOn:
    id: workspace-tab-worklog
- assertVisible:
    id: workspace-tab-worklog
- assertVisible:
    id: workspace-back-to-chat
- takeScreenshot: workspace-tabs-mobile.png
